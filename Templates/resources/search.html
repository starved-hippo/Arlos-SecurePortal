<!DOCTYPE html>
<html lang="en">
<head>
    <title>Search</title>
</head>
<body>
    <h1>Search user database</h1>
    <form method="post">
        <input type="text" id="username" name="username" required="true">
        <button type="submit">Search</button>
    </form>
    
    {% if results %}
    <h2>Search Results</h2>

    <ul>
    {% for user in results %}
        <li>{{ user[1] }} ({{ user[3] }})</li>
    {% endfor %}
    </ul>

    {% elif searched %}
        <p>No matching users found.</p>
    {% endif %}

</body>
</html>
